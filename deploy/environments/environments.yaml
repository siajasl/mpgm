# Environments this project declares (DEP-1, DEP-4, `env.provision`).
#
# What `env.provision` operates on and nothing more: a provider MUST refuse an
# environment name not listed here rather than infer one from a directory
# existing under `deploy/environments/` (contracts/env.provision.md,
# `src/env/compose-provider.ts`). `production` is deliberately absent — DEP-4
# asks the harness to be *able* to provision it, but declaring it is
# T4.1.4b's job, once every `env.provision` operation that could reach it is
# gated too, not just `release.deliver`'s.
# `releaseOverride` is applied only on an `up` carrying an explicit `image`
# (DEP-3, `release.deliver`, T4.1.2) — see the compose file it names.
#
# `approval` is what decides whether a release needs an operator's
# confirmation before it may reach this environment (HIL-2, DESIGN §9
# decision 10/11) — required on every entry, not defaulted
# (`src/env/compose-provider.ts`'s `gatedEnvironmentNames`,
# `src/policy/deploy-gate.ts`): `required` refuses
# `release.deliver#deliver`/`#rollback` for this environment until an
# operator has confirmed the exact digest named; `none` says explicitly that
# this environment needs no such confirmation. `staging` is marked `required`
# here to demonstrate the gate against a real, declared environment — T4.1.4a
# needs no `production` to prove the release path is gated (PLAN.md's split);
# T4.1.4b is what marks `production` itself once `env.provision`'s own
# operations are gated too.
environments:
  - name: test
    compose: deploy/environments/test/compose.yaml
    project: mpgm-test
    releaseOverride: deploy/environments/test/compose.release.yaml
    approval: none
  - name: staging
    compose: deploy/environments/staging/compose.yaml
    project: mpgm-staging
    releaseOverride: deploy/environments/staging/compose.release.yaml
    approval: required
