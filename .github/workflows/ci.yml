name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24.x is Active LTS, 26.x is Current. Both are supported by engines.
        node-version: ['24.x', '26.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Build precedes test: the crash-resume fixture runs as a subprocess
      # against the built package, because Node cannot import the TS sources.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # PLAN M1.1 verification: a synthetic run killed at arbitrary points must
      # resume identically, and replay must reproduce it byte-for-byte.
      - name: Milestone M1.1 crash/restart demo
        run: npm run demo:crash

      # T1.3.6: every operator-console verb, against a scripted provider.
      - name: CLI end-to-end
        run: npm run demo:cli
