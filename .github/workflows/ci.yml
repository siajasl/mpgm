name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs are named after the check kinds IMP-2 requires — build, lint, typecheck,
# test, scan — because the merge gate (`ci.checks`, src/implement/checks.ts)
# decides per kind, and a workflow whose jobs say which obligation they serve
# needs no mapping table to be understood. A kind with no reported result
# blocks the merge exactly as a failing one does, so deleting a job here does
# not make merges easier; it stops them.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24.x is Active LTS, 26.x is Current. Both are supported by engines.
        node-version: ['24.x', '26.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci

      # Build precedes test: the crash-resume and worktree fixtures run as
      # subprocesses against the built package, because Node cannot import the
      # TS sources.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # PLAN M1.1 verification: a synthetic run killed at arbitrary points must
      # resume identically, and replay must reproduce it byte-for-byte.
      - name: Milestone M1.1 crash/restart demo
        run: npm run demo:crash

      # T1.3.6: every operator-console verb, against a scripted provider.
      - name: CLI end-to-end
        run: npm run demo:cli

      # T2.2.5 / T2.2.7: trace queries and plan ingestion, both offline.
      - name: Trace queries
        run: npm run demo:trace
      - name: Plan ingestion dry run
        run: npm run demo:ingest

      # T3.1.8: the switchover — mpgm reads its own plan, implements a task in
      # a worktree, has it reviewed, and merges it.
      - name: Switchover
        run: npm run demo:switchover

      # T4.1.1: the `test` environment comes up and down from the committed
      # IaC alone (DEP-1, DEP-4). `ubuntu-latest` ships a Docker daemon, so
      # this needs no extra setup step.
      - name: env.provision against the committed IaC
        run: npm run demo:env

      # T4.1.2: two real releases of the sample service, delivered in turn,
      # and a rollback to the first — a staged release with a tested
      # rollback path (DEP-2, DEP-3). Same Docker daemon as demo:env above.
      - name: release.deliver — staged release with a tested rollback
        run: npm run demo:release

      # T4.1.3: a second release whose content never actually changed (an
      # induced regression) fails its smoke check and is rolled back with no
      # operator involved, and the outcome is recorded (DEP-2, DEP-5). Same
      # Docker daemon as demo:env above.
      - name: release verification — induced regression auto-rolls back
        run: npm run demo:verify

  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci

      # SAF-5, dependency audit.
      - name: Dependency audit
        run: npm audit --audit-level=high

      # SAF-5, secret scanning — the same patterns the kernel redacts with
      # (SAF-6), so there is one definition of what a credential looks like.
      - name: Build
        run: npm run build
      - name: Secret scan
        run: node scripts/scan-secrets.mjs

  codeql:
    name: scan (codeql)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      # SAF-5, static analysis. eslint is a linter, not a security analyser;
      # this is the part of the scan that looks for vulnerabilities rather than
      # for style.
      - uses: github/codeql-action/analyze@v4
